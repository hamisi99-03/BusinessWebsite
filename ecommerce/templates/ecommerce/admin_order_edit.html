{% extends "ecommerce/base.html" %}

{% block title %}Edit Order #{{ order.pk }}{% endblock %}

{% block content %}
<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card">
                <div class="card-header">
                    <h5 class="mb-0">Edit Order #{{ order.pk }}</h5>
                </div>
                <div class="card-body">
                    <form method="post">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label for="fulfillment_status" class="form-label">Fulfillment Status</label>
                            <select name="fulfillment_status" id="fulfillment_status" class="form-select">
                                {% for value, label in fulfillment_choices %}
                                    <option value="{{ value }}" {% if value == order.status %}selected{% endif %}>
                                        {{ label }}
                                    </option>
                                {% endfor %}
                            </select>
                        </div>
                        {% if order.payment_type == 'credit' %}
                        <div class="mb-3">
                            <label for="payment_status" class="form-label">Credit Approval</label>
                            <select name="payment_status" id="payment_status" class="form-select">
                                {% for value, label in payment_status_choices %}
                                    <option value="{{ value }}" {% if value == order.payment_status %}selected{% endif %}>
                                        {{ label }}
                                    </option>
                                {% endfor %}
                            </select>
                        </div>
                        {% endif %}
                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-primary flex-fill">Update Order</button>
                            <a href="{% url 'orders_list' %}" class="btn btn-outline-secondary">Cancel</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
