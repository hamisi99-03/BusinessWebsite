<!DOCTYPE html>
<html>
<head><meta charset="utf-8"></head>
<body style="font-family:Arial,sans-serif;background:#F9FAFB;margin:0;padding:0;">
  <table width="100%" cellpadding="0" cellspacing="0">
    <tr>
      <td align="center" style="padding:40px 20px;">
        <table width="560" cellpadding="0" cellspacing="0" style="background:#FFFFFF;border-radius:12px;overflow:hidden;">
          <tr>
            <td style="padding:32px;background:#E07A5F;text-align:center;">
              <h1 style="color:#FFFFFF;margin:0;font-size:22px;">H&I Store</h1>
            </td>
          </tr>
          <tr>
            <td style="padding:32px;">
              <p style="font-size:15px;color:#374151;line-height:1.6;">Hi <strong>{{ user.get_full_name|default:user.username }}</strong>,</p>
              <p style="font-size:15px;color:#374151;line-height:1.6;">{{ message }}</p>
              {% if order %}
              <table style="margin:24px 0;width:100%;background:#FFFBF5;border-radius:8px;padding:16px;">
                <tr>
                  <td style="font-size:13px;color:#6B7280;padding:4px 0;">Order</td>
                  <td style="font-size:13px;font-weight:600;padding:4px 0;text-align:right;">#{{ order.id }}</td>
                </tr>
                <tr>
                  <td style="font-size:13px;color:#6B7280;padding:4px 0;">Total</td>
                  <td style="font-size:13px;font-weight:600;padding:4px 0;text-align:right;">KSh {{ order.get_total_amount|floatformat:0 }}</td>
                </tr>
                <tr>
                  <td style="font-size:13px;color:#6B7280;padding:4px 0;">Status</td>
                  <td style="font-size:13px;font-weight:600;padding:4px 0;text-align:right;">{{ order.get_payment_status_display }}</td>
                </tr>
              </table>
              <a href="{{ scheme }}://{{ host }}{% url 'order_detail' order.id %}"
                 style="display:inline-block;background:#E07A5F;color:#FFFFFF;padding:12px 28px;border-radius:8px;text-decoration:none;font-weight:600;font-size:14px;">
                View Order
              </a>
              {% endif %}
            </td>
          </tr>
          <tr>
            <td style="padding:24px 32px;background:#F9FAFB;text-align:center;font-size:12px;color:#9CA3AF;">
              H&I Store &middot; Thank you for shopping with us
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
