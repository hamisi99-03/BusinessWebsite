{% extends "ecommerce/base.html" %}
{% block title %}Reset Password — {{ target_user.username }}{% endblock %}

{% block content %}
<div class="page-header d-flex justify-content-between align-items-center">
  <div>
    <h1>Reset Password</h1>
    <p>Change password for <strong>{{ target_user.username }}</strong></p>
  </div>
  <a href="{% url 'admin_users_list' %}" class="btn btn-outline-primary btn-sm">
    <i class="bi bi-arrow-left me-1"></i> Back to Users
  </a>
</div>

<div class="row">
  <div class="col-md-6">
    <div class="card shadow-sm rounded-3">
      <div class="card-body p-4">
        <form method="POST">
          {% csrf_token %}
          <div class="mb-3">
            <label class="form-label">Username</label>
            <input type="text" class="form-control" value="{{ target_user.username }}" disabled>
          </div>
          <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="text" class="form-control" value="{{ target_user.email|default:'—' }}" disabled>
          </div>
          <div class="mb-3">
            <label class="form-label">New Password</label>
            <input type="password" name="new_password" class="form-control" required minlength="8"
                   placeholder="At least 8 characters">
          </div>
          <div class="mb-3">
            <label class="form-label">Confirm Password</label>
            <input type="password" name="confirm_password" class="form-control" required
                   placeholder="Re-enter new password">
          </div>
          <button type="submit" class="btn btn-warning w-100">
            <i class="bi bi-key me-1"></i> Reset Password
          </button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
